<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#f4f7f9" />
		<meta name="robots" content="index, follow" />
		<meta
			name="description"
			content="Check AeroExpress bus timings to and from Bhogapuram Airport, ASR-1 and ASR-2 routes, stops, fares, map links and flight-aware planning from Vizag."
		/>
		<meta property="og:title" content="Vizag to Bhogapuram Airport Bus Planner" />
		<meta
			property="og:description"
			content="AeroExpress timings, routes, stops, fares and flight-aware bus recommendations for Bhogapuram Airport."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://www.vizagairportbus.com/" />
		<link rel="canonical" href="https://www.vizagairportbus.com/" />
		<link rel="icon" type="image/svg+xml" href="/bus-favicon.svg" />
		<title>Vizag Airport Bus Timings, Routes &amp; Fares | Bhogapuram</title>
		<script>
			(() => {
				const savedTheme = localStorage.getItem('theme');
				const useDark =
					savedTheme === 'dark' ||
					(!savedTheme && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', useDark);
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', useDark ? '#0b1116' : '#f4f7f9');
			})();
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@graph": [
					{
						"@type": "WebSite",
						"@id": "https://www.vizagairportbus.com/#website",
						"name": "Vizag Airport Bus Info",
						"alternateName": "Vizag Airport Bus",
						"url": "https://www.vizagairportbus.com/"
					},
					{
						"@type": "WebApplication",
						"name": "Vizag Airport Bus Planner",
						"url": "https://www.vizagairportbus.com/",
						"applicationCategory": "TravelApplication",
						"operatingSystem": "Web"
					}
				]
			}
		</script>
	</head>
	<body>
		<div id="root">
			<main>
				<h1>Vizag to Bhogapuram Airport Bus Timings, Routes &amp; Fares</h1>
				<p>Plan an AeroExpress bus to or from Bhogapuram Airport, compare ASR-1 and ASR-2 departure times, and find boarding stops, fares and map links.</p>
				<nav>
					<a href="/vizag-airport-bus-timings/">Airport bus timings</a>
					<a href="/bhogapuram-airport-bus-routes/">Airport bus routes</a>
					<a href="/bhogapuram-airport-bus-fares/">Airport bus fares</a>
					<a href="/vizag-airport-bus-stops/">Airport bus stops</a>
				</nav>
			</main>
		</div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
