<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#f4f7f9" />
		<meta name="robots" content="index, follow" />
		<meta
			name="description"
			content="Find the right AeroExpress bus from Visakhapatnam to Vizag Airport based on where you are and when your flight leaves."
		/>
		<meta property="og:title" content="Vizag Airport Bus Planner" />
		<meta
			property="og:description"
			content="Timings, stops, fares and flight-aware AeroExpress bus recommendations."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://www.vizagairportbus.com/" />
		<link rel="canonical" href="https://www.vizagairportbus.com/" />
		<link rel="icon" type="image/svg+xml" href="/bus-favicon.svg" />
		<title>Vizag Airport Bus Info</title>
		<script>
			(() => {
				const savedTheme = localStorage.getItem('theme');
				const useDark =
					savedTheme === 'dark' ||
					(!savedTheme && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', useDark);
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', useDark ? '#0b1116' : '#f4f7f9');
			})();
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "Vizag Airport Bus Planner",
				"url": "https://www.vizagairportbus.com/",
				"applicationCategory": "TravelApplication",
				"operatingSystem": "Web"
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
